server:
  port: 8081                               # P12 expects NorthWind's MCP server here

spring:
  application:
    name: northwind-mcp-server
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    mcp:
      server:
        name: northwind
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE                 # served at /mcp
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${NORTHWIND_ISSUER_URI:https://login.northwind.example}   # lab profile: LabTokens

embabel:
  models:
    default-llm: ${NORTHWIND_DEFAULT_LLM}
    llms:
      balanced: ${NORTHWIND_LLM_BALANCED:${NORTHWIND_DEFAULT_LLM}}
  agent:
    platform:
      rest:
        process-kill-enabled: false
        process-status-enabled: false
        process-events-enabled: false

northwind:
  security:
    # where clients get tokens: announced at /.well-known/oauth-protected-resource (Chapter 88)
    authorization-server: ${NORTHWIND_ISSUER_URI:https://login.northwind.example}

management:
  endpoints:
    web:
      exposure:
        include: health
