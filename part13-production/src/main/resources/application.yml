spring:
  application:
    name: northwind-issue-service
  mvc:
    problemdetails:
      enabled: true                       # RFC 9457 error bodies (Chapter 97)
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

embabel:
  models:
    default-llm: ${NORTHWIND_DEFAULT_LLM}
    llms:
      cheap: ${NORTHWIND_LLM_CHEAP:${NORTHWIND_DEFAULT_LLM}}
      balanced: ${NORTHWIND_LLM_BALANCED:${NORTHWIND_DEFAULT_LLM}}
  agent:
    platform:
      rest:
        process-kill-enabled: false
        process-status-enabled: false
        process-events-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

northwind:
  model-timeout: 20s                      # per model call (Chapter 94)

# Chapter 94: Embabel's default action retry (5 attempts, backoffs growing to a minute) turned a 300 ms
# model timeout into a three-minute request. Bound the worst case explicitly.
embabel.agent.platform.action-qos.default:
  max-attempts: 3
  backoff-millis: 500
  backoff-multiplier: 2.0
  backoff-max-interval: 2000

northwind.carrier:
  webhook-secret: ${CARRIER_WEBHOOK_SECRET:lab-carrier-secret-change-me}   # shared with the carrier (Chapter 99)
