spring:
  application:
    name: northwind-advanced
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

embabel:
  models:
    default-llm: ${NORTHWIND_DEFAULT_LLM}
    llms:
      standard: ${NORTHWIND_LLM_STANDARD:${NORTHWIND_DEFAULT_LLM}}
  agent:
    platform:
      rest:
        process-kill-enabled: false
        process-status-enabled: false
        process-events-enabled: false

northwind:
  skills:
    directory: skills                    # SKILL.md folders, one per skill (Chapter 113)
