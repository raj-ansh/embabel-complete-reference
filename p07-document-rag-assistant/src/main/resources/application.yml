spring:
  application:
    name: document-rag-assistant
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

embabel:
  models:
    default-llm: ${NORTHWIND_DEFAULT_LLM}
    default-embedding-model: ${NORTHWIND_EMBEDDING_MODEL:nomic-embed-text}
    llms:
      balanced: ${NORTHWIND_LLM_BALANCED:${NORTHWIND_DEFAULT_LLM}}
  agent:
    platform:
      toolloop:
        max-iterations: 8          # a search loop must end
      rest:
        process-kill-enabled: false
        process-status-enabled: false
        process-events-enabled: false

northwind:
  rag:
    knowledge-dir: ${NORTHWIND_KNOWLEDGE_DIR:knowledge}
    index-path: ${NORTHWIND_INDEX_PATH:}          # empty = in-memory index, rebuilt at startup
    embedder: model                               # model | hashing (offline development and tests)
    max-chunk-size: 800
    overlap-size: 100
    ingest-on-startup: true
