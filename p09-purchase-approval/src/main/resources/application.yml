spring:
  application:
    name: purchase-approval
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

embabel:
  models:
    default-llm: ${NORTHWIND_DEFAULT_LLM}
    llms:
      cheap: ${NORTHWIND_LLM_CHEAP:${NORTHWIND_DEFAULT_LLM}}
      balanced: ${NORTHWIND_LLM_BALANCED:${NORTHWIND_DEFAULT_LLM}}
  agent:
    platform:
      rest:                        # this application exposes its own, authorised endpoints
        process-kill-enabled: false
        process-status-enabled: false
        process-events-enabled: false

northwind:
  purchasing:
    auto-approve-limit: 1000.00    # at or below: approved by policy, no human needed
    hard-limit: 25000.00           # above: rejected by policy, no human can approve
